ar(--bg)!important;color:var(--green-dark)!important;font-weight:700!important;box-shadow:none!important}\n[data-theme=\"dark\"] .theme-toggle{border-color:#456b55!important;background:#19211c!important;color:var(--green-dark)!important}\n</style></head><body>\n<div id=\"singleFileBack\" style=\"position:fixed;right:12px;bottom:12px;z-index:99999\">\n<button type=\"button\" onclick=\"parent.goHome()\" style=\"border:0;border-radius:12px;padding:12px 16px;background:#198754;color:white;font:700 14px system-ui;box-shadow:0 4px 16px #0002;cursor:pointer\">← Zur Startseite</button>\n</div>\n\n<header class=\"topbar\"><div class=\"nav\"><div class=\"brand-icon\" aria-hidden=\"true\">▤</div><div class=\"brand\">Teil 2 lesen Goethe B2</div><button class=\"btn btn-secondary theme-toggle\" id=\"themeToggle\" type=\"button\" aria-label=\"Dark Mode aktivieren\" title=\"Dark Mode\">☾ <span id=\"themeLabel\">Dark Mode</span></button><div class=\"nav-right\">LERNEN · ÜBEN · VERBESSERN</div></div></header>\n<main class=\"wrap\">\n<section id=\"home\">\n<div class=\"hero\"><div class=\"eyebrow\">Deutschprüfung · Niveau B2</div><h1>Goethe B2 – Lesen Teil 2</h1><p>Ordne die Textbausteine den Nummern 10 bis 15 zu. Pro Thema gibt es acht Möglichkeiten; sechs davon gehören zu den nummerierten Lösungen.</p></div>\n<div class=\"section-head\"><h2>Wähle ein Thema</h2><span class=\"subtle\">6 Übungsthemen · ohne Anmeldung</span></div>\n<div id=\"topicGrid\" class=\"topic-grid\"></div>\n<section class=\"history\"><div class=\"section-head\"><h2>Dein Lernverlauf</h2><button class=\"btn btn-quiet\" id=\"clearHistory\">Verlauf löschen</button></div><div id=\"historyList\" class=\"history-list\"></div></section>\n</section>\n<section id=\"test\" class=\"hidden\">\n<button class=\"backlink\" id=\"backHome\">← Zurück zu den Themen</button>\n<div class=\"test-title-row\"><div><div class=\"eyebrow\" id=\"topicEyebrow\">THEMA 1</div><h1 id=\"testTitle\"></h1><div class=\"subtle\">Ordne jeder passenden Möglichkeit eine Nummer von 10 bis 15 zu. Falsche Möglichkeiten bleiben ohne Zuordnung.</div></div><div class=\"subtle\" id=\"questionCount\">8 Möglichkeiten</div></div>\n<div id=\"results\" class=\"hidden\"></div>\n<div class=\"notice\">Ordne die acht Möglichkeiten mit den Pfeilen ↑ und ↓. Die ersten sechs Plätze sind 10–15, die letzten zwei sind 00.</div>\n<div id=\"questions\" class=\"questions\"></div>\n<div class=\"button-row\" style=\"margin-top:22px\"><button class=\"btn btn-primary\" id=\"correctBtn\">Korrigieren</button><button class=\"btn btn-secondary\" id=\"newTestBtn\">Neuer Test</button><button class=\"btn btn-quiet\" id=\"retryBtn\" style=\"display:none\">Noch einmal versuchen</button></div>\n</section>\n<footer class=\"footer\">Lernhilfe für Goethe B2 Lesen Teil 2. Die deutschen Formulierungen aus dem bereitgestellten PDF wurden ohne arabische Übersetzungen übernommen.<div class=\"creator-credit\">Designed and developed by <a href=\"https://www.instagram.com/mourad.abb/\" target=\"_blank\" rel=\"noopener noreferrer\">@Mourad.abb</a></div></footer>\n</main>\n<script>\nconst topics = [{\"title\": \"Platform (Glück)\", \"icon\": \"☘\", \"options\": [{\"text\": \"selbst hergestellt (gemacht)\", \"key\": \"10\"}, {\"text\": \"verpassen\", \"key\": \"11\"}, {\"text\": \"Hektisch\", \"key\": \"12\"}, {\"text\": \"Hobby (Freizeit)\", \"key\": \"13\"}, {\"text\": \"Gesund Essen\", \"key\": \"14\"}, {\"text\": \"Land\", \"key\": \"15\"}, {\"text\": \"Luxusartikel kaufen\", \"key\": \"none\"}, {\"text\": \"den ganzen Tag zu Hause bleiben\", \"key\": \"none\"}]}, {\"title\": \"Messen Land Deutschland\", \"icon\": \"▦\", \"options\": [{\"text\": \"Als Mutter\", \"key\": \"10\"}, {\"text\": \"Blütezeit\", \"key\": \"11\"}, {\"text\": \"Endlich - leisten\", \"key\": \"12\"}, {\"text\": \"Besucher\", \"key\": \"13\"}, {\"text\": \"Deutsche Messen\", \"key\": \"14\"}, {\"text\": \"Faktor\", \"key\": \"15\"}, {\"text\": \"Eintrittskarten online verkaufen\", \"key\": \"none\"}, {\"text\": \"Messen im Ausland absagen\", \"key\": \"none\"}]}, {\"title\": \"Online Studieren (Digitalisierung)\", \"icon\": \"⌘\", \"options\": [{\"text\": \"Abitur\", \"key\": \"10\"}, {\"text\": \"Frage\", \"key\": \"11\"}, {\"text\": \"Gruppenarbeit\", \"key\": \"12\"}, {\"text\": \"Begeistert\", \"key\": \"13\"}, {\"text\": \"Ziel\", \"key\": \"14\"}, {\"text\": \"Außerdem\", \"key\": \"15\"}, {\"text\": \"Präsenzunterricht jeden Tag\", \"key\": \"none\"}, {\"text\": \"ohne Internetzugang lernen\", \"key\": \"none\"}]}, {\"title\": \"Menschen unterschiedlichen Alters arbeiten zusammen\", \"icon\": \"◉\", \"options\": [{\"text\": \"Ansicht\", \"key\": \"10\"}, {\"text\": \"Konflikt\", \"key\": \"11\"}, {\"text\": \"Perspektive\", \"key\": \"12\"}, {\"text\": \"Unproduktivität\", \"key\": \"13\"}, {\"text\": \"Einkommen\", \"key\": \"14\"}, {\"text\": \"Es muss alle handeln\", \"key\": \"15\"}, {\"text\": \"gleiche Hobbys in jeder Altersgruppe\", \"key\": \"none\"}, {\"text\": \"getrennte Arbeitsplätze für alle\", \"key\": \"none\"}]}, {\"title\": \"Teilen im Leben\", \"icon\": \"↗\", \"options\": [{\"text\": \"Schleißlich\", \"key\": \"10\"}, {\"text\": \"U-Bahn S-Bahn\", \"key\": \"11\"}, {\"text\": \"Fremde Menschen\", \"key\": \"12\"}, {\"text\": \"Warum\", \"key\": \"13\"}, {\"text\": \"geteilt\", \"key\": \"14\"}, {\"text\": \"meißt in kleinen\", \"key\": \"15\"}, {\"text\": \"alles ausschließlich allein besitzen\", \"key\": \"none\"}, {\"text\": \"nie öffentliche Verkehrsmittel nutzen\", \"key\": \"none\"}]}, {\"title\": \"Keine Chance\", \"icon\": \"◇\", \"options\": [{\"text\": \"Begabungen werden Behindert\", \"key\": \"10\"}, {\"text\": \"Andere Themen interessieren sie nicht (Nicht Anderes achten)\", \"key\": \"11\"}, {\"text\": \"Doch es störte ihn überhaupt nicht\", \"key\": \"12\"}, {\"text\": \"Der standardisierte Durchschnitt steht also im Vordergrund\", \"key\": \"13\"}, {\"text\": \"Einige Wissenschaftler teilen seine Ansichten\", \"key\": \"14\"}, {\"text\": \"Ein Grund .. Arbeitgeber sein\", \"key\": \"15\"}, {\"text\": \"alle Schüler bekommen dieselben Noten\", \"key\": \"none\"}, {\"text\": \"Noten spielen überhaupt keine Rolle\", \"key\": \"none\"}]}];\nconst $=id=>document.getElementById(id);\nlet currentTopic=-1, currentOptions=[], answers={}, corrected=false;\nfunction esc(s){return String(s).replace(/[&<>\"']/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]))}\nfunction shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction renderHome(){\n const root=$(\"topicGrid\");root.innerHTML=\"\";\n topics.forEach((t,i)=>{const b=document.createElement(\"button\");b.className=\"topic-card\";b.innerHTML=`<div class=\"topic-top\"><span class=\"topic-icon\">${t.icon}</span><span class=\"topic-number\">THEMA ${i+1}</span></div><h3>${esc(t.title)}</h3><p>8 Möglichkeiten · Nummern 10–15</p>`;b.addEventListener(\"click\",()=>startTopic(i));root.appendChild(b)});\n renderHistory();\n}\nfunction startTopic(i,force=false){\n if(currentTopic===i && Object.keys(assignments).length>0 && !force && !corrected){if(!confirm(\"Deine Antworten gehen verloren. Möchtest du wirklich einen neuen Test starten?\"))return}\n currentTopic=i;corrected=false;answers={};assignments={};selectedOptionId=null;currentOptions=shuffle(topics[i].options.map((o,index)=>({...o,id:index})));\n $(\"home\").classList.add(\"hidden\");$(\"test\").classList.remove(\"hidden\");$(\"results\").classList.add(\"hidden\");$(\"retryBtn\").style.display=\"none\";$(\"correctBtn\").style.display=\"inline-block\";\n $(\"topicEyebrow\").textContent=`THEMA ${i+1}`;$(\"testTitle\").textContent=topics[i].title;$(\"questionCount\").textContent=\"8 Möglichkeiten\";\n renderQuestions();window.scrollTo({top:0,behavior:\"smooth\"});\n}\nlet selectedOptionId=null;\nfunction renderQuestions(){\n const root=$(\"questions\");root.innerHTML=\"\";\n const board=document.createElement(\"div\");board.className=\"matching-board\";\n const title=document.createElement(\"div\");title.className=\"option-bank-title\";\n title.textContent=\"Ordne die Möglichkeiten mit den Pfeilen ↑ und ↓. Die ersten sechs Plätze sind 10–15, die letzten zwei sind 00.\"\n board.appendChild(title);\n const bank=document.createElement(\"div\");bank.className=\"option-bank\";bank.id=\"optionBank\";\n const ordered=currentOptions;\n ordered.forEach((o,index)=>{\n  const card=document.createElement(\"div\");card.className=\"option-item sortable-option\";card.id=`option-${o.id}`;\n  card.draggable=false;card.dataset.id=String(o.id);card.tabIndex=0;card.setAttribute(\"role\",\"listitem\");\n  const badge=document.createElement(\"span\");badge.className=\"slot-number order-number\";\n  badge.textContent=index<6?String(10+index):\"00\";\n  const tx=document.createElement(\"div\");tx.className=\"option-text\";tx.textContent=o.text;\n  card.append(badge,tx);\n  if(corrected){\n   const target=index<6?String(10+index):\"none\";\n   const ok=o.key===target;\n   card.classList.add(ok?\"correct\":\"wrong\");\n   const fb=document.createElement(\"div\");fb.className=\"option-feedback\";\n   fb.textContent=ok?(o.key===\"none\"?\"✓ Richtig · 00\":\"✓ Richtig · Nummer \"+o.key):(o.key===\"none\"?\"✕ Falsch · diese Möglichkeit gehört nicht zu 00\":\"✕ Falsch · richtige Nummer: \"+o.key);\n   card.appendChild(fb);\n  }\n  bank.appendChild(card);\n });\n // Simple mobile-friendly reordering: select an option, then tap ↑ or ↓.\n if(!corrected){\n  bank.querySelectorAll(\".sortable-option\").forEach(card=>{\n   const controls=document.createElement(\"div\");controls.className=\"move-controls\";\n   const up=document.createElement(\"button\");up.type=\"button\";up.className=\"move-btn\";up.textContent=\"↑\";up.setAttribute(\"aria-label\",\"Eine Position nach oben\");\n   const down=document.createElement(\"button\");down.type=\"button\";down.className=\"move-btn\";down.textContent=\"↓\";down.setAttribute(\"aria-label\",\"Eine Position nach unten\");\n   const move=(delta)=>{\n    const cards=[...bank.querySelectorAll(\".sortable-option\")];const i=cards.indexOf(card);const j=i+delta;\n    if(j<0||j>=cards.length)return;\n    const other=cards[j];\n    if(delta<0)bank.insertBefore(card,other);else bank.insertBefore(other,card);\n    const ids=[...bank.querySelectorAll(\".sortable-option\")].map(el=>Number(el.dataset.id));\n    currentOptions.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));\n    renderQuestions();\n   };\n   up.disabled=card===bank.firstElementChild;\n   down.disabled=card===bank.lastElementChild;\n   up.addEventListener(\"click\",()=>move(-1));down.addEventListener(\"click\",()=>move(1));\n   controls.append(up,down);card.appendChild(controls);\n  });\n }\n board.appendChild(bank);root.appendChild(board);\n}\nlet assignments={};\nfunction correctAnswers(){\n if(corrected)return;corrected=true;\n let right=0,wrong=0;\n currentOptions.forEach((o,index)=>{\n  const expected=index<6?String(10+index):\"none\";\n  if(o.key===expected)right++;else wrong++;\n });\n wrong=8-right;\n renderQuestions();\n $(\"results\").classList.remove(\"hidden\");$(\"results\").innerHTML=`<div class=\"results-card\"><div class=\"score-main\"><span>Dein Ergebnis</span><strong>${right} / 8</strong><span>richtige Antworten</span></div><div class=\"stat good\"><strong>${right}</strong><span>Richtig</span></div><div class=\"stat bad\"><strong>${wrong}</strong><span>Falsch</span></div><div class=\"stat reviewstat\"><strong>${8-right}</strong><span>Noch üben</span></div></div>`;\n $(\"correctBtn\").style.display=\"none\";$(\"retryBtn\").style.display=\"inline-block\";\n saveHistory({topic:topics[currentTopic].title,score:right,total:8,when:new Date().toISOString()});\n $(\"results\").scrollIntoView({behavior:\"smooth\",block:\"start\"});\n}\nfunction saveHistory(entry){try{const h=JSON.parse(localStorage.getItem(\"goetheB2Teil2History\")||\"[]\");h.unshift(entry);localStorage.setItem(\"goetheB2Teil2History\",JSON.stringify(h.slice(0,20)))}catch(e){}renderHistory()}\nfunction renderHistory(){const root=$(\"historyList\");let h=[];try{h=JSON.parse(localStorage.getItem(\"goetheB2Teil2History\")||\"[]\")}catch(e){}if(!h.length){root.innerHTML='<div class=\"empty\">Noch keine Ergebnisse. Nach dem Korrigieren erscheinen deine letzten Versuche hier auf diesem Gerät.</div>';return}root.innerHTML=h.map(x=>`<div class=\"history-item\"><div><strong>${esc(x.topic)}</strong><div class=\"subtle\">${new Date(x.when).toLocaleString(\"de-DE\")}</div></div><div><strong>${x.score}/${x.total}</strong></div></div>`).join(\"\")}\n$(\"correctBtn\").addEventListener(\"click\",correctAnswers);\n$(\"newTestBtn\").addEventListener(\"click\",()=>startTopic(currentTopic,true));\n$(\"retryBtn\").addEventListener(\"click\",()=>startTopic(currentTopic,true));\n$(\"backHome\").addEventListener(\"click\",()=>{$(\"test\").classList.add(\"hidden\");$(\"home\").classList.remove(\"hidden\");renderHome();window.scrollTo({top:0,behavior:\"smooth\"})});\n$(\"clearHistory\").addEventListener(\"click\",()=>{if(confirm(\"Möchtest du den lokalen Lernverlauf wirklich löschen?\")){try{localStorage.removeItem(\"goetheB2Teil2History\")}catch(e){}renderHistory()}});\nfunction applyTheme(theme){document.documentElement.dataset.theme=theme;const dark=theme===\"dark\",btn=$(\"themeToggle\");btn.innerHTML=dark?'☀ <span id=\"themeLabel\">Light Mode</span>':'☾ <span id=\"themeLabel\">Dark Mode</span>';btn.setAttribute(\"aria-label\",dark?\"Light Mode aktivieren\":\"Dark Mode aktivieren\");btn.title=dark?\"Light Mode\":\"Dark Mode\";try{localStorage.setItem(\"goetheB2Teil2Theme\",theme)}catch(e){}}\n(function(){let theme=\"light\";try{theme=localStorage.getItem(\"goetheB2Teil2Theme\")||\"light\"}catch(e){}applyTheme(theme)})();\n$(\"themeToggle\").addEventListener(\"click\",()=>applyTheme(document.documentElement.dataset.theme===\"dark\"?\"light\":\"dark\"));\nrenderHome();\n<\/script></body></html>",

\n.passage p{margin:0 0 14px}.passage p:last-child{margin-bottom:0}\n.gap{display:inline-block;max-width:100%;width:155px;border:1px solid #9bc9ae;border-radius:8px;background:var(--bg);color:var(--ink);padding:7px;font-size:13px;vertical-align:middle}\n.option-bank{display:grid;gap:9px}.sentence{display:grid;grid-template-columns:35px 1fr;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}\n.letter{display:grid;place-items:center;background:var(--green-soft);color:var(--green-dark);font-weight:800;border-radius:9px;min-height:32px}.sentence p{margin:2px 0;font-size:14px}\n.sentence.correct{background:var(--green-soft);border-color:#9bd1b1}.sentence.wrong{background:var(--red-bg);border-color:#f0aaa5}\n.scorebox{background:var(--green-soft);padding:16px;border-radius:13px;margin:18px 0}.scorebox strong{font-size:25px;color:var(--green-dark)}\n/* Fix: keep the answer-selection boxes inside the passage and prevent overflow */\n.gap-select,.gap{\n  box-sizing:border-box;\n  width:min(155px,100%);\n  max-width:100%;\n  min-width:0;\n  vertical-align:middle;\n}\n.passage{min-width:0;overflow-wrap:anywhere}\n.gap-select option{white-space:normal}\n@media(max-width:560px){\n  .passage{padding:14px;font-size:14px}\n  .gap-select,.gap{width:min(130px,100%);max-width:100%}\n  .sentence{padding:10px}\n  .sentence p{font-size:13px}\n}\n</style></head><body>\n<div id=\"singleFileBack\" style=\"position:fixed;right:12px;bottom:12px;z-index:99999\">\n<button type=\"button\" onclick=\"parent.goHome()\" style=\"border:0;border-radius:12px;padding:12px 16px;background:#198754;color:white;font:700 14px system-ui;box-shadow:0 4px 16px #0002;cursor:pointer\">← Zur Startseite</button>\n</div>\n\n<header class=\"topbar\"><div class=\"nav\"><div class=\"brand-icon\">▤</div><div class=\"brand\">Teil 2 lesen Goethe B2</div><button class=\"btn btn-secondary theme-toggle\" id=\"themeToggle\">☾ Dark Mode</button><div class=\"nav-right\">LERNEN · ÜBEN · VERBESSERN</div></div></header>\n<main class=\"wrap\"><section id=\"home\"><div class=\"hero\"><div class=\"eyebrow\">DEUTSCHPRÜFUNG · NIVEAU B2</div><h1>Goethe B2 – Lesen Teil 2</h1><p>Lies den Text und wähle für jede Lücke den passenden Satz. Sechs Sätze passen, zwei bleiben übrig.</p></div>\n<div class=\"section-head\"><h2>Wähle ein Thema</h2><span class=\"subtle\">6 Übungsthemen</span></div><div id=\"topicGrid\" class=\"topic-grid\"></div>\n<section class=\"history\"><div class=\"section-head\"><h2>Dein Lernverlauf</h2><button class=\"btn btn-quiet\" id=\"clearHistory\">Verlauf löschen</button></div><div id=\"historyList\"></div></section></section>\n<section id=\"test\" class=\"hidden\"><button class=\"backlink\" id=\"backHome\">← Zurück zu den Themen</button><div class=\"test-title-row\"><div><div class=\"eyebrow\" id=\"topicEyebrow\"></div><h1 id=\"testTitle\"></h1><div class=\"subtle\">Ordne die Sätze a–h den Lücken 10–15 zu.</div></div></div>\n<div id=\"topicNote\" class=\"notice\" dir=\"rtl\" lang=\"ar\"></div>\n<div class=\"notice\">Tipp: Achte auf die Schlüsselwörter und den Zusammenhang vor und nach der Lücke. Jeder Satz darf nur einmal verwendet werden.</div>\n<div id=\"passage\" class=\"passage\"></div><div class=\"section-label\">Die Sätze</div><div id=\"options\" class=\"option-bank\"></div><div id=\"results\" class=\"hidden\"></div>\n<div class=\"button-row\" style=\"margin-top:22px\"><button class=\"btn btn-primary\" id=\"checkBtn\">Korrigieren</button><button class=\"btn btn-secondary\" id=\"newBtn\">Neuer Versuch</button><button class=\"btn btn-quiet hidden\" id=\"retryBtn\">Noch einmal versuchen</button></div></section>\n<footer class=\"footer\">Eigene Übungstexte für Goethe B2 Lesen Teil 2. Die Schlüsselwörter der ursprünglichen Themen wurden beibehalten.</footer></main>\n<script>\nconst topics=[\n{title:\"Platform (Glück)\",icon:\"☘\",p:[\n\"Schulen sollten die besonderen Stärken ihrer Schülerinnen und Schüler erkennen. {{10}} Nicht alle interessieren sich für dieselben Fächer. {{11}}\",\n\"Ein Schüler kann zum Beispiel besonders gut zeichnen. {{12}} Trotzdem wird in vielen Schulen häufig nach einheitlichen Maßstäben bewertet. {{13}}\",\n\"Auch Fachleute diskutieren darüber, wie Schulen individueller fördern können. {{14}} Wer eigene Ideen entwickelt, kann später ein Unternehmen gründen. {{15}}\"\n],o:[\n[\"Wer etwas selbst hergestellt hat, empfindet es oft als besonders persönlich.\",10],\n[\"Im Alltag kann man leicht einen wichtigen Termin verpassen, wenn man zu viel plant.\",11],\n[\"Ein hektischer Tagesablauf lässt vielen Menschen kaum Zeit für Erholung.\",12],\n[\"Ein Hobby hilft dabei, Stress abzubauen und eigene Interessen zu pflegen.\",13],\n[\"Viele achten darauf, gesund essen zu können, ohne auf Genuss zu verzichten.\",14],\n[\"Das Leben auf dem Land bietet manchen Menschen mehr Ruhe und Natur.\",15],\n[\"Luxusartikel zu kaufen ist für alle Menschen der einzige Weg zum Glück.\",0],\n[\"Wer den ganzen Tag zu Hause bleibt, hat niemals Stress.\",0]]},\n{title:\"Messen in Deutschland\",icon:\"▦\",p:[\n\"Die Leipziger Messe gehört zu den traditionsreichsten Veranstaltungen Europas. {{10}} Über viele Jahrhunderte war sie ein wichtiger Treffpunkt für Handel und Austausch.\",\n\"Nach schwierigen Jahren verbesserte sich die wirtschaftliche Lage vieler Familien. {{11}} Dadurch konnten mehr Menschen Produkte kaufen, und Unternehmen erhielten neue Möglichkeiten, ihre Waren zu präsentieren.\",\n\"Messen sind nicht nur für Firmen interessant. {{12}} Viele Menschen gehen durch die Hallen, schauen sich Neuheiten an und genießen die besondere Atmosphäre. Mit steigenden Löhnen änderten sich auch die Möglichkeiten der Beschäftigten. {{13}}\",\n\"Heute sind Veranstaltungen aus Deutschland auch international gefragt. {{14}} Trotz digitaler Angebote bleibt der persönliche Kontakt wichtig. {{15}}\"\n],o:[\n[\"Als Mutter aller Messen gilt die Leipziger Messe.\",10],\n[\"Eine Blütezeit der Messen waren die sogenannten Wirtschaftswunderjahre.\",11],\n[\"Für viele Besucher ist so ein Messerundgang ungefähr das Gleiche wie ein Stadtbummel.\",12],\n[\"Endlich konnte sich auch der Arbeiter wieder etwas leisten.\",13],\n[\"Deutsche Messen sind aber auch ein erfolgreicher Exportartikel.\",14],\n[\"Hier kommt der menschliche Faktor ins Spiel.\",15],\n[\"Eintrittskarten werden bei allen Messen kostenlos an jeden verteilt.\",0],\n[\"Messen verlieren grundsätzlich alle Besucher, sobald neue Produkte vorgestellt werden.\",0]]},\n{title:\"Online studieren\",icon:\"⌘\",p:[\n\"Nach dem {{10}} überlegen viele junge Menschen, welchen Bildungsweg sie einschlagen möchten. Dabei stellt sich oft die {{11}}, ob ein Online-Studium zum eigenen Alltag passt. Digitale Kurse machen das Lernen von unterschiedlichen Orten aus möglich.\",\n\"Auch eine {{12}} kann online funktionieren, wenn Aufgaben klar verteilt werden. Viele Studierende sind {{13}}, weil sie ihre Lernzeiten flexibler gestalten können. Trotzdem brauchen sie Disziplin und eine gute Planung.\",\n\"Das {{14}} eines Studiums ist nicht nur ein Abschluss, sondern auch der Aufbau von Wissen. {{15}} können digitale Materialien den Zugang zu Informationen erleichtern. Entscheidend bleibt, dass Lernende regelmäßig arbeiten und Fragen stellen.\"\n],o:[\n[\"Nach dem Abitur informieren sich viele über verschiedene Studienmöglichkeiten.\",10],\n[\"Vor der Anmeldung stellt sich oft die Frage, wie viel Zeit der Kurs braucht.\",11],\n[\"Bei Gruppenarbeit können Studierende gemeinsam Ideen entwickeln und Lösungen finden.\",12],\n[\"Viele sind begeistert, weil sie nicht jeden Tag zum Campus fahren müssen.\",13],\n[\"Das Ziel eines Studiums ist auch, fundiertes Wissen für den Beruf zu erwerben.\",14],\n[\"Außerdem lassen sich Lernzeiten oft besser an persönliche Verpflichtungen anpassen.\",15],\n[\"Präsenzunterricht jeden Tag ist bei allen Online-Kursen vorgeschrieben.\",0],\n[\"Ohne Internetzugang lassen sich sämtliche digitalen Lernplattformen problemlos nutzen.\",0]]},\n{title:\"Menschen unterschiedlichen Alters arbeiten zusammen\",icon:\"◉\",p:[\n\"Wenn Menschen unterschiedlichen Alters zusammenarbeiten, bringt jeder seine eigene {{10}} mit. So können verschiedene Erfahrungen in ein Projekt einfließen. Manchmal entsteht jedoch ein {{11}}, weil Kollegen Probleme unterschiedlich beurteilen.\",\n\"Eine andere {{12}} kann helfen, eine schwierige Situation neu zu betrachten. Wenn Aufgaben schlecht verteilt sind, droht {{13}}. Deshalb sollten Teams offen über ihre Arbeitsweise sprechen und voneinander lernen.\",\n\"Ein gutes {{14}} ist für viele Beschäftigte wichtig, aber nicht der einzige Grund für Zufriedenheit. Damit sich die Zusammenarbeit verbessert, {{15}}. Verantwortung tragen sowohl die Leitung als auch die Mitarbeitenden.\"\n],o:[\n[\"Die Ansicht eines Kollegen kann sich durch Gespräche mit anderen verändern.\",10],\n[\"Ein Konflikt lässt sich leichter lösen, wenn beide Seiten einander zuhören.\",11],\n[\"Eine neue Perspektive hilft dabei, Probleme aus einem anderen Blickwinkel zu sehen.\",12],\n[\"Klare Absprachen können Unproduktivität verhindern und die Zusammenarbeit verbessern.\",13],\n[\"Ein angemessenes Einkommen ist wichtig, aber nicht für alle der einzige Motivationsgrund.\",14],\n[\"muss alle handeln, damit sich die Situation am Arbeitsplatz verbessert.\",15],\n[\"Alle Altersgruppen haben dieselben Hobbys und immer die gleichen beruflichen Ziele.\",0],\n[\"Getrennte Arbeitsplätze für alle sind die einzige Lösung für Konflikte.\",0]]},\n{title:\"Teilen im Leben\",icon:\"↗\",p:[\n\"{{10}} entdecken immer mehr Menschen, dass gemeinsames Nutzen praktisch sein kann. In Städten sind {{11}} für viele unverzichtbar. Auf dem Weg zur Arbeit sitzen sie oft neben {{12}}, ohne miteinander zu sprechen.\",\n\"{{13}} sollte man selten gebrauchte Dinge unbedingt selbst kaufen? Manche Gegenstände werden lieber {{14}}, zum Beispiel Werkzeuge oder Fahrräder. Das spart Geld und kann Ressourcen schonen.\",\n\"Solche Angebote entstehen {{15}} und werden später manchmal in weiteren Stadtteilen bekannt. So verändert sich langsam die Art, wie Menschen Dinge nutzen und miteinander teilen.\"\n],o:[\n[\"Schließlich erkennen immer mehr Menschen die Vorteile gemeinsamer Nutzung.\",10],\n[\"U-Bahn und S-Bahn bringen viele Menschen schnell durch die Stadt.\",11],\n[\"Neben fremden Menschen zu sitzen, gehört für Pendler zum Alltag.\",12],\n[\"Warum sollte man selten gebrauchte Gegenstände unbedingt selbst kaufen?\",13],\n[\"Wenn Dinge geteilt werden, müssen sie nicht von jeder Person einzeln angeschafft werden.\",14],\n[\"Solche Initiativen beginnen meist in kleinen Gruppen und wachsen nach und nach.\",15],\n[\"Alles ausschließlich allein zu besitzen, ist immer billiger und einfacher.\",0],\n[\"Wer öffentliche Verkehrsmittel nutzt, darf niemals ein Fahrrad ausleihen.\",0]]},\n{title:\"Keine Chancen für Talent\",icon:\"◇\",p:[\n\"Viele Schulen verlangen von allen Lernenden einen guten Notendurchschnitt. {{10}} Dadurch erhalten besondere Fähigkeiten nicht immer genug Raum, obwohl Schülerinnen und Schüler unterschiedliche Stärken haben.\",\n\"Manche begabte Jugendliche widmen sich fast ausschließlich ihrem Spezialgebiet. {{11}} Ein Schüler erzählte einmal, dass seine Mitschüler sich für andere Dinge interessierten. {{12}}\",\n\"Bei der Beurteilung von Schülerinnen und Schülern zählt oft vor allem eine einheitliche Leistung. {{13}} Der Bildungsforscher kritisiert diese Entwicklung und fordert mehr Raum für individuelle Stärken. {{14}}\",\n\"Dass sich diese Situation entwickelt hat, kann mehrere Ursachen haben. {{15}} Deshalb wird darüber gesprochen, wie Schulen und Unternehmen Talente besser fördern können.\"\n],o:[\n[\"Die Entwicklung spezieller Begabungen wird nämlich durch den Zwang zu einem guten Notendurchschnitt behindert.\",10],\n[\"Andere Themen dagegen interessieren sie überhaupt nicht.\",11],\n[\"Doch die störten ihn überhaupt nicht.\",12],\n[\"Der standardisierte Durchschnitt steht also im Vordergrund.\",13],\n[\"Einige Wissenschaftler teilen seine Ansichten.\",14],\n[\"Ein Grund für diese Entwicklung sollen auch die Arbeitgeber sein.\",15],\n[\"Alle Jugendlichen sollten unabhängig von ihren Interessen denselben Beruf wählen.\",0],\n[\"Besondere Talente entwickeln sich automatisch, ohne Übung oder Unterstützung.\",0]]}\n];\nconst $=id=>document.getElementById(id);let current=-1,answers={},opts=[],done=false;\nfunction shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\nfunction home(){const g=$('topicGrid');g.innerHTML='';topics.forEach((t,i)=>{let b=document.createElement('button');b.className='topic-card';b.innerHTML=`<div class=\"topic-top\"><span class=\"topic-icon\">${t.icon}</span><span class=\"topic-number\">THEMA ${i+1}</span></div><h3>${esc(t.title)}</h3><p>6 Lücken · 8 Sätze</p>`;b.onclick=()=>start(i);g.appendChild(b)});history()}\nfunction start(i){current=i;answers={};done=false;let t=topics[i];opts=shuffle(t.o.map((x,id)=>({text:x[0],key:x[1],id})));$('home').classList.add('hidden');$('test').classList.remove('hidden');$('results').classList.add('hidden');$('checkBtn').classList.remove('hidden');$('retryBtn').classList.add('hidden');$('topicEyebrow').textContent='THEMA '+(i+1);$('testTitle').textContent=t.title;\n$('topicNote').textContent=(i===1||i===5)?'ملاحظة: في هذا الموضوع، ست جمل صحيحة مبنية على الكلمات المفتاحية الأصلية، وجملتان إضافيتان من إنشائنا لإكمال التمرين.':'ملاحظة: جميع الجمل في هذا الموضوع من إنشائنا، مع الحفاظ على الكلمات المفتاحية الأصلية وصحتها. الهدف هو التدريب على استخراج الكلمة المفتاحية من وسط الجملة.';\n$('passage').innerHTML=t.p.map(p=>'<p>'+p.replace(/\\{\\{(\\d+)\\}\\}/g,(m,n)=>`<select class=\"gap-select\" data-gap=\"${n}\"><option value=\"\">Lücke ${n}</option></select>` )+'</p>').join('');\n$('options').innerHTML=opts.map((o,j)=>`<div class=\"option-item\" id=\"opt${o.id}\"><span class=\"slot-number\">${String.fromCharCode(97+j)}</span><div class=\"option-text\">${esc(o.text)}</div></div>`).join('');\ndocument.querySelectorAll('.gap-select').forEach(s=>{opts.forEach((o,j)=>{let op=document.createElement('option');op.value=o.id;op.textContent=String.fromCharCode(97+j)+') '+o.text;s.appendChild(op)});s.onchange=()=>{answers[s.dataset.gap]=s.value;let used=Object.values(answers);document.querySelectorAll('.gap-select').forEach(other=>[...other.options].forEach(op=>{if(op.value)op.disabled=used.includes(op.value)&&op.value!==other.value}))}});\nwindow.scrollTo({top:0,behavior:'smooth'})}\nfunction check(){if(done)return;let sels=[...document.querySelectorAll('.gap-select')];if(sels.some(s=>!s.value)){alert('Bitte fülle zuerst alle sechs Lücken aus.');return}let right=0;for(let n=10;n<=15;n++){let o=opts.find(x=>String(x.id)===answers[n]);let ok=o&&o.key===n;if(ok)right++;let s=document.querySelector(`[data-gap=\"${n}\"]`);s.style.borderColor=ok?'var(--green)':'var(--red)';s.title=ok?'Richtig':'Richtiger Satz: '+String.fromCharCode(97+opts.findIndex(x=>x.key===n))}\nopts.forEach(o=>{let el=$('opt'+o.id),gap=Object.keys(answers).find(n=>answers[n]===String(o.id));if(o.key===0){if(gap)el.classList.add('wrong')}else if(gap&&Number(gap)===o.key)el.classList.add('correct');else if(gap)el.classList.add('wrong')});\ndone=true;$('results').classList.remove('hidden');$('results').innerHTML=`<div class=\"results-card\"><div class=\"score-main\"><span>Dein Ergebnis</span><strong>${right} / 6</strong><span>richtige Antworten</span></div></div><p><strong>Lösungen:</strong> ${[10,11,12,13,14,15].map(n=>n+': '+String.fromCharCode(97+opts.findIndex(o=>o.key===n))).join(' · ')}</p>`;$('checkBtn').classList.add('hidden');$('retryBtn').classList.remove('hidden');save({topic:topics[current].title,score:right,when:new Date().toISOString()});$('results').scrollIntoView({behavior:'smooth',block:'start'})}\nfunction save(x){try{let h=JSON.parse(localStorage.getItem('goetheB2Teil2History')||'[]');h.unshift(x);localStorage.setItem('goetheB2Teil2History',JSON.stringify(h.slice(0,20)))}catch(e){}history()}\nfunction history(){let h=[];try{h=JSON.parse(localStorage.getItem('goetheB2Teil2History')||'[]')}catch(e){}$('historyList').innerHTML=h.length?h.map(x=>`<div class=\"history-item\"><div><strong>${esc(x.topic)}</strong><div class=\"subtle\">${new Date(x.when).toLocaleDateString('de-DE')}</div></div><strong>${x.score}/6</strong></div>`).join(''):'<div class=\"empty\">Nach dem Korrigieren erscheinen deine letzten Versuche hier.</div>'}\n$('checkBtn').onclick=check;$('newBtn').onclick=()=>start(current);$('retryBtn').onclick=()=>start(current);$('backHome').onclick=()=>{$('test').classList.add('hidden');$('home').classList.remove('hidden');home();window.scrollTo({top:0,behavior:'smooth'})};$('clearHistory').onclick=()=>{if(confirm('Lernverlauf löschen?')){localStorage.removeItem('goetheB2Teil2History');history()}};$('themeToggle').onclick=()=>{let d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'':'dark';$('themeToggle').textContent=d?'☾ Dark Mode':'☀ Light Mode';try{localStorage.setItem('goetheB2Teil2Theme',d?'light':'dark')}catch(e){}};try{if(localStorage.getItem('goetheB2Teil2Theme')==='dark'){document.documentElement.dataset.theme='dark';$('themeToggle').textContent='☀ Light Mode'}}catch(e){}home();\n<\/script></body></html>"
};
const app = document.getElementById('app');
let pageStack = ['home'];
let currentPage = 'home';
function showPage(which, push=true){
  if(!docs[which]) return;
  if(push && which !== currentPage){ pageStack.push(which); try{ history.pushState({goethePage:which}, '', '#'+which); }catch(e){} }
  currentPage = which;
  app.srcdoc = docs[which];
}
function goHome(){ pageStack = ['home']; currentPage='home'; showPage('home', false); }
function openTraining(which){ showPage(which, true); }
function goBackStep(){
  if(pageStack.length > 1) pageStack.pop();
  const previous = pageStack[pageStack.length-1] || 'home';
  currentPage = previous;
  app.srcdoc = docs[previous];
}
window.goHome=goHome;
window.openTraining=openTraining;
window.goBackStep=goBackStep;
window.addEventListener('popstate', function(){ if(pageStack.length>1) goBackStep(); else goHome(); });
app.addEventListener('load', function(){
  try {
    const d = app.contentDocument;
    if (!d || d.__goetheNavInstalled) return;
    d.__goetheNavInstalled = true;
    d.addEventListener('click', function(ev){
      const card = ev.target.closest('a.training-card');
      if (card) {
        ev.preventDefault(); ev.stopPropagation();
        const label = (card.innerText || card.textContent || '').toLowerCase();
        openTraining(label.includes('im satz') ? 'sentence' : 'keywords');
      }
      // Intentionally leave #backHome to the training page itself so its own step navigation works.
    }, true);
  } catch (e) {}
});
showPage('home', false);
</script></body></html>
